<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three Road Capital — Trading Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0A0C0F;
    --bg-elevated:#101318;
    --surface:#161A20;
    --surface-2:#1C2129;
    --border:#262B33;
    --border-soft:#1D2129;
    --text:#E9E6DE;
    --text-dim:#9298A3;
    --text-faint:#565C68;
    --gold:#C9A24B;
    --gold-soft:rgba(201,162,75,0.14);
    --gold-line:rgba(201,162,75,0.35);
    --green:#3FB68B;
    --green-soft:rgba(63,182,139,0.14);
    --red:#E0555C;
    --red-soft:rgba(224,85,92,0.14);
    --blue:#5B8DEF;
    --blue-soft:rgba(91,141,239,0.14);
    --amber:#E0A83F;
    --amber-soft:rgba(224,168,63,0.14);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', 'SF Mono', monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft);color:var(--gold);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-line);}

  a,button,input,select,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;flex-shrink:0;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    padding:26px 22px 18px 22px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand .mark{
    display:flex;align-items:center;gap:10px;margin-bottom:4px;
  }
  .brand .mark svg{flex-shrink:0;}
  .brand-name{
    font-family:var(--font-display);
    font-size:16.5px;font-weight:600;letter-spacing:0.02em;
    color:var(--text);
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10px;letter-spacing:0.14em;
    color:var(--gold);text-transform:uppercase;
    margin-top:6px;
  }
  nav.tabs{padding:14px 12px;flex:1;}
  .tab-btn{
    width:100%;text-align:left;
    background:none;border:none;
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;margin-bottom:2px;
    border-radius:8px;
    color:var(--text-dim);
    font-size:13.2px;font-weight:500;
    letter-spacing:0.01em;
    border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .tab-btn svg{opacity:.75;flex-shrink:0;}
  .tab-btn:hover{background:var(--surface);color:var(--text);}
  .tab-btn.active{
    background:var(--gold-soft);
    color:var(--gold);
    border-left:2px solid var(--gold);
  }
  .tab-btn.active svg{opacity:1;}
  .sidebar-foot{
    padding:16px 20px 20px;
    border-top:1px solid var(--border-soft);
  }
  .acct-chip{
    font-family:var(--font-mono);
    font-size:11px;color:var(--text-faint);
    display:flex;justify-content:space-between;margin-bottom:3px;
  }
  .acct-chip b{color:var(--text-dim);font-weight:600;}
  .settings-link{
    margin-top:10px;font-size:11.5px;color:var(--gold);
    background:none;border:none;padding:0;text-decoration:none;
    display:inline-flex;align-items:center;gap:5px;
  }

  /* ---------- MAIN ---------- */
  main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1360px;}
  .page-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:26px;flex-wrap:wrap;gap:14px;
  }
  .page-head h1{
    font-family:var(--font-display);
    font-size:27px;font-weight:600;margin:0 0 6px;letter-spacing:0.01em;
  }
  .page-head p{margin:0;color:var(--text-dim);font-size:13px;max-width:560px;}
  .eyebrow{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.16em;
    color:var(--gold);text-transform:uppercase;margin-bottom:8px;
  }

  .panel{display:none;}
  .panel.active{display:block;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:20px 22px;
  }
  .card + .card{margin-top:16px;}
  .card h3{
    font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--text-dim);margin:0 0 16px;
  }
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;background:var(--bg-elevated);
    border:1px solid var(--border);border-radius:7px;
    padding:8px 10px;font-size:13.2px;color:var(--text);
    font-family:var(--font-mono);
  }
  select{font-family:var(--font-body);}
  textarea{font-family:var(--font-body);resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold-line);}
  .field{margin-bottom:13px;}
  .field-row{display:flex;gap:12px;}
  .field-row > *{flex:1;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);
    padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);
    transition:border-color .12s;
  }
  .btn:hover{border-color:var(--gold-line);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#171308;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:none;border:1px solid var(--border);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}

  .pill{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;
    padding:2.5px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;
  }
  .pill-win{background:var(--green-soft);color:var(--green);}
  .pill-loss{background:var(--red-soft);color:var(--red);}
  .pill-be{background:var(--surface-2);color:var(--text-dim);}
  .pill-open{background:var(--blue-soft);color:var(--blue);}
  .pill-long{background:var(--green-soft);color:var(--green);}
  .pill-short{background:var(--red-soft);color:var(--red);}

  .phase-accumulation{color:var(--blue);}
  .phase-uptrend{color:var(--green);}
  .phase-distribution{color:var(--amber);}
  .phase-downtrend{color:var(--red);}
  .bg-accumulation{background:var(--blue-soft);}
  .bg-uptrend{background:var(--green-soft);}
  .bg-distribution{background:var(--amber-soft);}
  .bg-downtrend{background:var(--red-soft);}
  .val-under{color:var(--green);}
  .val-over{color:var(--red);}
  .val-fair{color:var(--blue);}
  .val-unset{color:var(--text-faint);}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--font-mono);}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:var(--surface-2);cursor:pointer;}
  .table-wrap{overflow-x:auto;}
  .empty-state{
    padding:38px 20px;text-align:center;color:var(--text-faint);font-size:13px;
  }
  .empty-state .big{font-family:var(--font-display);font-size:16px;color:var(--text-dim);margin-bottom:4px;display:block;}

  .stat-box{
    background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:9px;
    padding:14px 16px;
  }
  .stat-box .lbl{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .stat-box .val{font-family:var(--font-mono);font-size:21px;font-weight:600;}
  .stat-box .sub{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .pos{color:var(--green);} .neg{color:var(--red);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,6,8,.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    width:min(560px,92vw);max-height:88vh;overflow-y:auto;padding:26px;
  }
  .modal h2{font-family:var(--font-display);font-size:19px;margin:0 0 18px;}
  .modal-close{position:sticky;top:0;float:right;background:none;border:none;color:var(--text-faint);font-size:20px;}

  .tag-chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
    border:1px solid var(--border);padding:3px 9px;border-radius:14px;font-size:11.5px;
    margin:0 6px 6px 0;cursor:pointer;color:var(--text-dim);
  }
  .tag-chip.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold);}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select, .toolbar input{width:auto;min-width:130px;}
  .spacer{flex:1;}

  .diverge-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .diverge-lbl{width:52px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex-shrink:0;}
  .diverge-track{
    flex:1;height:20px;background:var(--bg-elevated);border-radius:5px;position:relative;overflow:hidden;
    border:1px solid var(--border-soft);
  }
  .diverge-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);}
  .diverge-fill{position:absolute;top:0;bottom:0;border-radius:4px;}
  .diverge-val{width:44px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);flex-shrink:0;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{
    aspect-ratio:1;border-radius:7px;border:1px solid var(--border-soft);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;position:relative;
  }
  .cal-cell .d{position:absolute;top:4px;left:6px;font-size:9.5px;color:var(--text-faint);}
  .cal-cell .r{font-weight:700;font-size:12.5px;}
  .cal-cell.empty{border:none;}
  .cal-dow{text-align:center;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;}

  .footnote{font-size:11.5px;color:var(--text-faint);margin-top:10px;line-height:1.6;}
  .hint{
    background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:8px;
    padding:11px 14px;font-size:12px;color:var(--text-dim);margin-bottom:16px;
  }
  .hint b{color:var(--gold);}
  .rr-good{color:var(--green);} .rr-bad{color:var(--red);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .checkbox-row input{width:auto;}

  .auth-screen{
    position:fixed;inset:0;background:var(--bg);z-index:80;
    display:flex;align-items:center;justify-content:center;
  }
  .auth-card{
    width:min(380px,92vw);background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:32px 28px;
  }
  .auth-card .mark{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;}
  .auth-card h2{font-family:var(--font-display);font-size:19px;text-align:center;margin:6px 0 2px;}
  .auth-card p{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 22px;}
  .auth-error{
    background:var(--red-soft);border:1px solid rgba(224,85,92,0.4);color:var(--red);
    font-size:12px;padding:8px 12px;border-radius:7px;margin-bottom:14px;display:none;
  }
  .sign-out-link{
    margin-top:6px;font-size:11px;color:var(--text-faint);background:none;border:none;padding:0;
    display:inline-flex;align-items:center;gap:5px;
  }
  .sign-out-link:hover{color:var(--red);}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="11.5" stroke="#C9A24B" stroke-width="1.3"/><path d="M13 4 L13 22 M6 9 L20 17 M20 9 L6 17" stroke="#C9A24B" stroke-width="1.1" opacity="0.7"/><circle cx="13" cy="13" r="2.4" fill="#C9A24B"/></svg>
        <div class="brand-name">Three Road</div>
      </div>
      <div class="brand-sub">Trading Desk</div>
    </div>
    <nav class="tabs" id="tabNav"></nav>
    <div class="sidebar-foot">
      <div class="acct-chip"><span>Account</span><b id="chipAccount">$0</b></div>
      <div class="acct-chip"><span>Default risk</span><b id="chipRisk">0%</b></div>
      <div style="font-size:10.5px;color:var(--gold);margin-top:8px;line-height:1.5;">🔗 Log, Backtest &amp; Watchlist are shared with everyone on this link. Account settings below stay private to you.</div>
      <button class="settings-link" onclick="openSettings()">⚙ Account settings</button>
      <div><button class="sign-out-link" id="signOutBtn">⏻ Sign out</button></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="mainArea"></main>
</div>

<div id="modalRoot"></div>
<div id="authGate"></div>

<script>
/* =========================================================================
   BACKEND CONFIG — fill these in from your Supabase project
   (Project Settings -> API -> Project URL / anon public key)
========================================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://mtbrlumjdvnkqsuiyepw.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10YnJsdW1qZHZua3FzdWl5ZXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzcxMjAsImV4cCI6MjEwMDc1MzEyMH0.ngMBTD1cUgA8hSu390keGF-7qDifpct2GBpHicZXEso'
};
const CONFIG_READY = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR-ANON');
const sb = CONFIG_READY ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

/* =========================================================================
   STORAGE HELPERS
   Shared keys (trades, backtest, topdown) -> Supabase table `shared_state`
   Personal keys (settings) -> browser localStorage, per device
========================================================================= */
function isSharedKey(key){
  return key==='trades' || key==='backtest' || key==='topdown';
}
async function storeGet(key, fallback){
  if(!isSharedKey(key)){
    try{ const raw = localStorage.getItem('td_'+key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  if(!sb) return fallback;
  try{
    const { data, error } = await sb.from('shared_state').select('value').eq('key', key).maybeSingle();
    if(error || !data) return fallback;
    return data.value;
  }catch(e){ console.error('storage get failed', key, e); return fallback; }
}
async function storeSet(key, value){
  if(!isSharedKey(key)){
    try{ localStorage.setItem('td_'+key, JSON.stringify(value)); }catch(e){}
    return;
  }
  if(!sb) return;
  try{
    await sb.from('shared_state').upsert({ key, value, updated_at: new Date().toISOString() });
  }catch(e){ console.error('storage set failed', key, e); }
}

/* =========================================================================
   STATE
========================================================================= */
const STATE = {
  trades: [],       // live trades
  backtest: [],     // backtest/replay trades
  topdown: [],      // watchlist items with phase per timeframe
  settings: { accountSize: 100000, defaultRisk: 1 },
  activeTab: 'log',
  loaded: false
};
const TIMEFRAMES = ['1W','1D','4H','1H','15m'];
const PHASES = ['accumulation','uptrend','distribution','downtrend'];
const PHASE_LABEL = {accumulation:'Accumulation', uptrend:'Uptrend', distribution:'Distribution', downtrend:'Downtrend'};
const PHASE_SCORE = {accumulation:0.5, uptrend:1, distribution:-0.5, downtrend:-1};
const TF_WEIGHT = {'1W':5,'1D':4,'4H':3,'1H':2,'15m':1};
const SETUP_TAGS = ['Hammer','Engulfing','Liquidity Sweep','Volume Spike','VP Confluence','HTF Aligned','Market Open','Mid-Session','Market Close','Structure Break'];
const TRADE_TYPES = [
  {id:'reversion', label:'Mean Reversion (neutral)', desc:'No clear HTF bias, or range day. Target VWAP or the opposite band — the original thesis.'},
  {id:'continuation', label:'Trend Continuation (pullback)', desc:'Band touched is against the HTF trend — a pullback. Target extends past VWAP toward prior structure, not capped at VWAP.'},
  {id:'countertrend', label:'Countertrend Fade (caution)', desc:"Band touched is in the direction of the HTF trend — an overextension. This is the strategy's documented weak point: cap target at VWAP, cut size, or skip."}
];
const TRADE_TYPE_META = {
  reversion:{pill:'pill-open', short:'Reversion'},
  continuation:{pill:'pill-win', short:'Continuation'},
  countertrend:{pill:'pill-loss', short:'Countertrend'}
};
function modelPill(tt){
  tt = tt||'reversion';
  const m = TRADE_TYPE_META[tt]||TRADE_TYPE_META.reversion;
  return `<span class="pill ${m.pill}">${m.short}</span>`;
}

async function loadAll(){
  STATE.trades = await storeGet('trades', []);
  STATE.backtest = await storeGet('backtest', []);
  STATE.topdown = await storeGet('topdown', []);
  STATE.settings = await storeGet('settings', { accountSize: 100000, defaultRisk: 1 });
  STATE.loaded = true;
  refreshChips();
}
function refreshChips(){
  document.getElementById('chipAccount').textContent = '$' + Number(STATE.settings.accountSize).toLocaleString();
  document.getElementById('chipRisk').textContent = STATE.settings.defaultRisk + '%';
}

/* =========================================================================
   NAV / TABS
========================================================================= */
const TABS = [
  {id:'log', label:'Trading Log', icon:'📒'},
  {id:'backtest', label:'Backtest Log', icon:'⟲'},
  {id:'stats', label:'Statistics', icon:'📊'},
  {id:'topdown', label:'Top Down Analysis', icon:'◎'},
  {id:'risk', label:'Risk Calculator', icon:'⚖'},
];
function iconSvg(id){
  const s = 'stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const map = {
    log:`<svg width="16" height="16" viewBox="0 0 24 24" ${s}><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>`,
    backtest:`<svg width="16" height="16" viewBox="0 0 24 24" ${s}><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-5h5"/></svg>`,
    stats:`<svg width="16" height="16" viewBox="0 0 24 24" ${s}><path d="M4 20V10M12 20V4M20 20v-7"/></svg>`,
    topdown:`<svg width="16" height="16" viewBox="0 0 24 24" ${s}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>`,
    risk:`<svg width="16" height="16" viewBox="0 0 24 24" ${s}><path d="M12 3v3M6 6l3 2M18 6l-3 2M4 13h6M14 13h6M8 13a4 4 0 0 1-4-4M20 13a4 4 0 0 1-4-4"/><path d="M12 13v8M9 21h6"/></svg>`
  };
  return map[id]||'';
}
function renderNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t => `
    <button class="tab-btn ${STATE.activeTab===t.id?'active':''}" data-tab="${t.id}">
      ${iconSvg(t.id)}<span>${t.label}</span>
    </button>`).join('');
  nav.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.activeTab=b.dataset.tab; renderNav(); renderMain(); });
  });
}

function renderMain(){
  const main = document.getElementById('mainArea');
  if(STATE.activeTab==='log') main.innerHTML = logPanel('trades','Trading Log','Every trade taken in the live market. Discipline shows up here before it shows up in the equity curve.');
  else if(STATE.activeTab==='backtest') main.innerHTML = logPanel('backtest','Backtest Log','Manual replay trades. Same fields as the live log — kept separate so statistics never blend simulated and real performance.');
  else if(STATE.activeTab==='stats') main.innerHTML = statsPanel();
  else if(STATE.activeTab==='topdown') main.innerHTML = topdownPanel();
  else if(STATE.activeTab==='risk') main.innerHTML = riskPanel();
  wireUpPanel();
}

/* =========================================================================
   SHARED FORMAT HELPERS
========================================================================= */
function fmtMoney(n){
  const v = Number(n)||0;
  const s = v<0 ? '-$'+Math.abs(v).toFixed(2) : '$'+v.toFixed(2);
  return s;
}
function fmtR(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return (n>=0?'+':'') + n.toFixed(2) + 'R';
}
function computeTradeR(t){
  const entry=parseFloat(t.entry), stop=parseFloat(t.stop), exit=parseFloat(t.exit);
  if(isNaN(entry)||isNaN(stop)||isNaN(exit)) return null;
  const riskDist = Math.abs(entry-stop);
  if(riskDist===0) return null;
  const dir = t.direction==='short' ? -1 : 1;
  const rewardDist = (exit-entry)*dir;
  return rewardDist/riskDist;
}
function computeTradePnl(t){
  const r = computeTradeR(t);
  if(r===null) return null;
  const acct = parseFloat(t.acctSize)||STATE.settings.accountSize;
  const riskPct = parseFloat(t.riskPct)||STATE.settings.defaultRisk;
  return acct * (riskPct/100) * r;
}
function tradeOutcome(t){
  if(t.outcome) return t.outcome;
  const r = computeTradeR(t);
  if(r===null) return 'open';
  if(Math.abs(r) < 0.05) return 'be';
  return r>0 ? 'win' : 'loss';
}
function outcomePill(o){
  const map = {win:'pill-win',loss:'pill-loss',be:'pill-be',open:'pill-open'};
  const lbl = {win:'Win',loss:'Loss',be:'B/E',open:'Open'};
  return `<span class="pill ${map[o]}">${lbl[o]}</span>`;
}

  }

  let filtered = list.filter(t=>{
    if(fa && t.asset!==fa) return false;

            <td>${t.riskPct||STATE.settings.defaultRisk}%</td>

}

/* =========================================================================
   STATISTICS PANEL
========================================================================= */
function statsPanel(){
  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">Performance</div>
        <h1>Statistics</h1>
        <p>Aggregated from your logs. Toggle the source to keep live performance separate from replay/backtest data — never average the two.</p>
      </div>
      <select id="statsSource" style="width:auto;min-width:170px">
        <option value="trades">Live trades</option>
        <option value="backtest">Backtest trades</option>
        <option value="both">Combined (not recommended)</option>
      </select>
    </div>
    <div id="statsBody"></div>
  `;
}
function getStatsList(source){
  if(source==='trades') return STATE.trades;
  if(source==='backtest') return STATE.backtest;
  return [...STATE.trades, ...STATE.backtest];
}
function renderStatsBody(){
  const source = document.getElementById('statsSource').value;
  const list = getStatsList(source).filter(t=>tradeOutcome(t)!=='open').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const body = document.getElementById('statsBody');
  if(list.length===0){
    body.innerHTML = `<div class="card"><div class="empty-state"><span class="big">No closed trades yet</span>Statistics populate once trades have an exit price.</div></div>`;
    return;
  }
  const rs = list.map(t=>computeTradeR(t)).filter(r=>r!==null);
  const wins = rs.filter(r=>r>0.05);
  const losses = rs.filter(r=>r<-0.05);
  const bes = rs.filter(r=>Math.abs(r)<=0.05);
  const winRate = rs.length? (wins.length/rs.length*100):0;
  const avgWin = wins.length? wins.reduce((a,b)=>a+b,0)/wins.length : 0;
  const avgLoss = losses.length? losses.reduce((a,b)=>a+b,0)/losses.length : 0;
  const totalR = rs.reduce((a,b)=>a+b,0);
  const grossWinR = wins.reduce((a,b)=>a+b,0);
  const grossLossR = Math.abs(losses.reduce((a,b)=>a+b,0));
  const profitFactor = grossLossR>0 ? grossWinR/grossLossR : (grossWinR>0?Infinity:0);
  const expectancy = rs.length? totalR/rs.length : 0;
  const pnls = list.map(t=>computeTradePnl(t)).filter(p=>p!==null);
  const totalPnl = pnls.reduce((a,b)=>a+b,0);

  // streaks
  let curStreak=0,bestWin=0,worstLoss=0,streakType=null;
  rs.forEach(r=>{
    const isWin = r>0.05;
    if(streakType===isWin){ curStreak++; } else { curStreak=1; streakType=isWin; }
    if(isWin) bestWin=Math.max(bestWin,curStreak); else worstLoss=Math.max(worstLoss,curStreak);
  });
  // equity curve (cumulative R) + max drawdown
  let cum=0, peak=0, maxDD=0; const points=[0];
  rs.forEach(r=>{ cum+=r; points.push(cum); peak=Math.max(peak,cum); maxDD=Math.min(maxDD, cum-peak); });
  // parallel equity curve in actual account currency, built trade-by-trade in the same order
  let cumPnl=0; const pointsPnl=[0];
  list.forEach(t=>{
    const r = computeTradeR(t); if(r===null) return;
    const pnl = computeTradePnl(t)||0;
    cumPnl += pnl; pointsPnl.push(cumPnl);
  });

  // breakdown by setup tag
  const tagAgg = {};
  list.forEach(t=>{ (t.tags||[]).forEach(tag=>{
    const r = computeTradeR(t); if(r===null) return;
    tagAgg[tag] = tagAgg[tag]||{n:0,sum:0}; tagAgg[tag].n++; tagAgg[tag].sum+=r;
  });});
  // breakdown by asset
  const assetAgg = {};
  list.forEach(t=>{
    const r = computeTradeR(t); if(r===null || !t.asset) return;
    assetAgg[t.asset]=assetAgg[t.asset]||{n:0,sum:0}; assetAgg[t.asset].n++; assetAgg[t.asset].sum+=r;
  });
  // breakdown by entry model — kept distinct on purpose: reversion, continuation and
  // countertrend trades are different edges and should never be averaged into one number
  const typeAgg = {};
  list.forEach(t=>{
    const r = computeTradeR(t); if(r===null) return;
    const label = (TRADE_TYPES.find(x=>x.id===(t.tradeType||'reversion'))||{}).label || 'Mean Reversion (neutral)';
    typeAgg[label]=typeAgg[label]||{n:0,sum:0}; typeAgg[label].n++; typeAgg[label].sum+=r;
  });

  body.innerHTML = `
    <div class="grid grid-4">
      <div class="stat-box"><div class="lbl">Win rate</div><div class="val">${winRate.toFixed(1)}%</div><div class="sub">${wins.length}W / ${losses.length}L / ${bes.length}BE</div></div>
      <div class="stat-box"><div class="lbl">Expectancy</div><div class="val ${expectancy>=0?'pos':'neg'}">${fmtR(expectancy)}</div><div class="sub">per trade, avg</div></div>
      <div class="stat-box"><div class="lbl">Profit factor</div><div class="val ${profitFactor>=1?'pos':'neg'}">${profitFactor===Infinity?'∞':profitFactor.toFixed(2)}</div><div class="sub">gross win ÷ gross loss</div></div>
      <div class="stat-box"><div class="lbl">Total R</div><div class="val ${totalR>=0?'pos':'neg'}">${fmtR(totalR)}</div><div class="sub">${fmtMoney(totalPnl)} est.</div></div>
    </div>
    <div class="grid grid-4" style="margin-top:16px">
      <div class="stat-box"><div class="lbl">Avg win / loss</div><div class="val">${fmtR(avgWin)} <span style="color:var(--text-faint)">/</span> ${fmtR(avgLoss)}</div><div class="sub">R multiples</div></div>
      <div class="stat-box"><div class="lbl">Max drawdown</div><div class="val neg">${maxDD.toFixed(2)}R</div><div class="sub">peak to trough</div></div>
      <div class="stat-box"><div class="lbl">Best streak</div><div class="val pos">${bestWin}</div><div class="sub">consecutive wins</div></div>
      <div class="stat-box"><div class="lbl">Worst streak</div><div class="val neg">${worstLoss}</div><div class="sub">consecutive losses</div></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="toolbar" style="margin-bottom:12px">
        <h3 style="margin:0">Equity Curve</h3>
        <div class="spacer"></div>
        <button class="btn btn-sm ${equityViewMode==='R'?'btn-gold':'btn-ghost'}" id="eqViewR">R multiple</button>
        <button class="btn btn-sm ${equityViewMode==='USD'?'btn-gold':'btn-ghost'}" id="eqViewUSD">Account $</button>
      </div>
      <div id="equityCurveWrap">${equityCurveSvg(equityViewMode==='USD'?pointsPnl:points, equityViewMode)}</div>
    </div>

    <div class="grid grid-3" style="margin-top:0">
      <div class="card">
        <h3>By Entry Model</h3>
        ${breakdownTable(typeAgg)}
      </div>
      <div class="card">
        <h3>By Setup / Confluence</h3>
        ${breakdownTable(tagAgg)}
      </div>
      <div class="card">
        <h3>By Asset</h3>
        ${breakdownTable(assetAgg)}
      </div>
    </div>

    <div class="card">
      <h3>Results Calendar</h3>
      <div class="toolbar">
        <button class="btn btn-sm btn-ghost" id="calPrev">‹ Prev</button>
        <span id="calLabel" style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);min-width:110px;text-align:center;display:inline-block"></span>
        <button class="btn btn-sm btn-ghost" id="calNext">Next ›</button>
      </div>
      <div id="calBody"></div>
      <div class="footnote">Cell shows net R closed that day. Green = positive session, red = negative. Intensity scales with magnitude.</div>
    </div>
  `;

  renderCalendar(list);
  document.getElementById('eqViewR').onclick = ()=>{ equityViewMode='R'; renderStatsBody(); };
  document.getElementById('eqViewUSD').onclick = ()=>{ equityViewMode='USD'; renderStatsBody(); };
}
function breakdownTable(agg){
  const rows = Object.entries(agg).sort((a,b)=>b[1].sum-a[1].sum);
  if(rows.length===0) return `<div class="empty-state" style="padding:20px 0">No tagged data yet</div>`;
  return `<table><thead><tr><th>Name</th><th>Trades</th><th>Total R</th><th>Avg R</th></tr></thead><tbody>
    ${rows.map(([name,d])=>`<tr><td style="font-family:inherit">${name}</td><td>${d.n}</td><td class="${d.sum>=0?'pos':'neg'}">${fmtR(d.sum)}</td><td class="${d.sum/d.n>=0?'pos':'neg'}">${fmtR(d.sum/d.n)}</td></tr>`).join('')}
  </tbody></table>`;
}
function equityCurveSvg(points, mode){
  mode = mode||'R';
  if(points.length<2) return `<div class="empty-state">Not enough closed trades yet</div>`;
  const w=1000,h=220,pad=30;
  const min=Math.min(...points), max=Math.max(...points);
  const range = (max-min)||1;
  const x = i => pad + (i/(points.length-1))*(w-2*pad);
  const y = v => h-pad - ((v-min)/range)*(h-2*pad);
  const path = points.map((p,i)=> (i===0?'M':'L') + x(i).toFixed(1)+','+y(p).toFixed(1)).join(' ');
  const zeroY = y(0);
  const last = points[points.length-1];
  const color = last>=0 ? 'var(--green)':'var(--red)';
  const lastLabel = mode==='USD' ? fmtMoney(last) : fmtR(last);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px;overflow:visible">
    <line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${x(points.length-1)}" cy="${y(last)}" r="3.5" fill="${color}"/>
    <text x="${w-pad}" y="18" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="${color}">${lastLabel}</text>
  </svg>`;
}
let calMonthOffset = 0;
let equityViewMode = 'R';
function renderCalendar(list){
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const year=target.getFullYear(), month=target.getMonth();
  document.getElementById('calLabel').textContent = target.toLocaleString('en-US',{month:'long',year:'numeric'});

  const byDay = {};
  list.forEach(t=>{
    if(!t.date) return;
    const r = computeTradeR(t); if(r===null) return;
    byDay[t.date] = (byDay[t.date]||0)+r;
  });
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const maxAbs = Math.max(1, ...Object.values(byDay).map(v=>Math.abs(v)));
  let cells = '';
  ['S','M','T','W','T','F','S'].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const r = byDay[dateStr];
    let bg = 'transparent', txtColor='var(--text-faint)';
    if(r!==undefined){
      const intensity = Math.min(1, Math.abs(r)/maxAbs);
      if(r>0){ bg = `rgba(63,182,139,${0.12+0.55*intensity})`; txtColor='var(--green)'; }
      else if(r<0){ bg = `rgba(224,85,92,${0.12+0.55*intensity})`; txtColor='var(--red)'; }
      else { bg='var(--surface-2)'; txtColor='var(--text-dim)'; }
    }
    cells += `<div class="cal-cell" style="background:${bg}"><span class="d">${d}</span>${r!==undefined?`<span class="r" style="color:${txtColor}">${r>=0?'+':''}${r.toFixed(1)}</span>`:''}</div>`;
  }
  document.getElementById('calBody').innerHTML = `<div class="cal-grid">${cells}</div>`;
  document.getElementById('calPrev').onclick = ()=>{ calMonthOffset--; renderCalendar(list); };
  document.getElementById('calNext').onclick = ()=>{ calMonthOffset++; renderCalendar(list); };
}

const VALUATION_BAND_PCT = 10; // within +/- this % of intrinsic value counts as "Fair Value"
function valuationInfo(item){
  const iv = parseFloat(item.intrinsicValue), price = parseFloat(item.currentPrice);
  if(isNaN(iv) || isNaN(price) || price===0){
    return {gap:null, label:'Not set', cls:'val-unset'};
  }
  const gapPct = ((iv - price)/price)*100; // positive = intrinsic value above price = undervalued
  let label, cls;
  if(gapPct > VALUATION_BAND_PCT){ label='Undervalued'; cls='val-under'; }
  else if(gapPct < -VALUATION_BAND_PCT){ label='Overvalued'; cls='val-over'; }
  else { label='Fair Value'; cls='val-fair'; }
  return {gap:gapPct, label, cls};
}
function tdScore(item){
  let sum=0, wsum=0;
  TIMEFRAMES.forEach(tf=>{
    const p = item.timeframes && item.timeframes[tf];
    if(p){ sum += PHASE_SCORE[p]*TF_WEIGHT[tf]; wsum += TF_WEIGHT[tf]; }
  });
  return wsum? sum/wsum : 0;
}

function renderRanking(){
  const list = [...STATE.topdown].filter(i=>i.type==='equity').map(i=>({...i, score: tdScore(i)})).sort((a,b)=>b.score-a.score);

function renderBreadth(){
  const group = document.getElementById('breadthGroup').value;

    const pct = Math.max(-1,Math.min(1,avg));
    const widthPct = Math.abs(pct)*50;
    const left = pct>=0 ? '50%' : (50-widthPct)+'%';

}

function riskPanel(){
  return `
    <div class="page-head">
      <div>

        <p>Position size and R:R, computed from your account settings. Risk tiers below reflect the manual's guidance: 1–2% on range/weak-trend days, 0.5% on strong-trend days — never more than 2% on any single trade.</p>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <h3>Inputs</h3>
        <div class="field-row">
          <div class="field"><label>Account size ($)</label><input type="number" id="rc_acct" value="${STATE.settings.accountSize}"></div>
          <div class="field"><label>Direction</label><select id="rc_dir"><option value="long">Long</option><option value="short">Short</option></select></div>
        </div>

          <label>Session context</label>
          <select id="rc_context">
            <option value="2">Range / low volatility day (up to 2%)</option>
            <option value="1.5">Weak trend day (1–1.5%)</option>
            <option value="1" selected>Neutral day (1%)</option>
            <option value="0.5">Strong trend day (0.5%)</option>
          </select>
        </div>
        <div class="field"><label>Risk % of account</label><input type="number" step="0.1" id="rc_riskpct" value="1"></div>
        <div class="field-row">
          <div class="field"><label>Entry price</label><input type="number" step="any" id="rc_entry" value=""></div>
          <div class="field"><label>Stop loss</label><input type="number" step="any" id="rc_stop" value=""></div>
        </div>
        <div class="field"><label>Take profit (optional)</label><input type="number" step="any" id="rc_target" value=""></div>
      </div>
      <div class="card">
        <h3>Result</h3>
        <div id="rc_result"></div>
      </div>
    </div>
  `;
}
function computeRisk(){
  const acct = parseFloat(document.getElementById('rc_acct').value)||0;
  const dir = document.getElementById('rc_dir').value;
  const riskPct = parseFloat(document.getElementById('rc_riskpct').value)||0;
  const entry = parseFloat(document.getElementById('rc_entry').value);
  const stop = parseFloat(document.getElementById('rc_stop').value);
  const target = parseFloat(document.getElementById('rc_target').value);
  const result = document.getElementById('rc_result');

  if(!acct || !riskPct || isNaN(entry) || isNaN(stop) || entry===stop){
    result.innerHTML = `<div class="empty-state" style="padding:20px 0">Enter account size, risk %, entry and stop to calculate.</div>`;
    return;
  }
  const slDist = Math.abs(entry-stop);
  const dollarRisk = acct*(riskPct/100);
  const shares = dollarRisk/slDist;
  const validDir = (dir==='long' && stop<entry) || (dir==='short' && stop>entry);
  let rr=null, dollarReward=null;
  if(!isNaN(target)){
    const rewardDist = dir==='long' ? target-entry : entry-target;
    rr = rewardDist/slDist;
    dollarReward = shares*rewardDist;
  }
  result.innerHTML = `
    <div class="grid grid-2">
      <div class="stat-box"><div class="lbl">$ at risk</div><div class="val neg">${fmtMoney(dollarRisk)}</div><div class="sub">${riskPct}% of ${fmtMoney(acct)}</div></div>
      <div class="stat-box"><div class="lbl">Position size</div><div class="val">${shares.toFixed(2)}</div><div class="sub">shares / units</div></div>
      <div class="stat-box"><div class="lbl">Stop distance</div><div class="val">${slDist.toFixed(4)}</div><div class="sub">per unit</div></div>
      <div class="stat-box"><div class="lbl">R : R ratio</div><div class="val ${rr===null?'':(rr>=1?'rr-good':'rr-bad')}">${rr===null?'—':'1 : '+rr.toFixed(2)}</div><div class="sub">${rr===null?'set a target':(rr>=1?'meets 1:1 minimum':'below 1:1 — reconsider')}</div></div>
    </div>
    ${dollarReward!==null?`<div class="stat-box" style="margin-top:14px"><div class="lbl">Potential reward</div><div class="val pos">${fmtMoney(dollarReward)}</div><div class="sub">if target is hit</div></div>`:''}
    ${!validDir?`<div class="hint" style="margin-top:14px;border-color:var(--red);background:var(--red-soft)"><b style="color:var(--red)">Check direction:</b> for a ${dir} trade the stop should be ${dir==='long'?'below':'above'} the entry price.</div>`:''}
    <div class="footnote">Position size = (Account × Risk%) ÷ Stop distance. Manual guidance: TP:SL should never be set below 1:1.</div>
  `;
}

    location.reload();
  };
  // Light polling so everyone sees each other's changes without a manual reload.
  // Skipped while a modal is open so it never interrupts someone mid-edit.
  setInterval(async ()=>{
    const modalOpen = document.getElementById('modalRoot').innerHTML.trim().length>0;
    if(modalOpen) return;
    if(!['log','backtest','topdown'].includes(STATE.activeTab)) return;
    STATE.trades = await storeGet('trades', STATE.trades);
    STATE.backtest = await storeGet('backtest', STATE.backtest);
    STATE.topdown = await storeGet('topdown', STATE.topdown);
    renderMain();
  }, 15000);
}
(async function init(){
  renderConfigBanner();
  if(!CONFIG_READY){
    // Can't authenticate without a backend — let bootApp run in a degraded, local-only mode.
    await bootApp();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    renderAuthScreen();
    return;
  }
  await bootApp();
})();
</script>
</body>
